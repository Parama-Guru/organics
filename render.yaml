# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploys the Docker image plus a managed Postgres instance.

databases:
  - name: organics-db
    databaseName: organics
    user: organics
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: organics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: organics-db
          property: connectionString
      # Set to the real Render URL after the first deploy, e.g. https://organics.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CURRENCY
        value: INR
      - key: NEXT_PUBLIC_LOCALE
        value: en-IN
      - key: DELIVERY_FEE_CENTS
        value: "4900"
      - key: FREE_DELIVERY_THRESHOLD_CENTS
        value: "49900"
      - key: RUN_MIGRATIONS
        value: "true"

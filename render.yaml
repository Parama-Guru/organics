# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Postgres is Supabase, not a Render database, so there is no `databases:` block.
# Render turns every environment variable below into a Docker build argument as
# well as a runtime variable. The Dockerfile only declares ARGs for the public
# NEXT_PUBLIC_* values, so SUPABASE_SECRET_KEY and the connection strings never
# get baked into an image layer.

services:
  - type: web
    name: organics
    runtime: docker
    plan: free
    # Closest Render region to the Supabase project in ap-northeast-1.
    # Cannot be changed after the service is created.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      # ---- free plan sizing. 512MB of RAM and a shared 0.1 CPU.
      #
      # V8 sizes its heap from the machine's total memory, not the container's
      # cgroup limit, so on a large host it will happily grow past 512MB and be
      # OOM-killed instead of collecting garbage. Capped below the limit to leave
      # room for the Prisma query engine and Node's own non-heap allocations,
      # which together measured about 220MB resident at idle.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      # One small instance behind a transaction pooler. See conf/config.example.yaml.
      - key: DATABASE_POOL_LIMIT
        value: "3"

      # ---- secrets: prompted once in the dashboard when the blueprint is created
      # Transaction pooler, port 6543, must end with ?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Session pooler, port 5432. `prisma migrate deploy` fails without this
      # because schema.prisma declares directUrl.
      - key: DIRECT_URL
        sync: false

      # ---- buyer accounts. Sessions and the login rate limiter live in Redis,
      # so conf/config.ts refuses to boot with accounts on and no REDIS_URL when
      # APP_ENV is prod: process memory would sign everyone out on every deploy.
      - key: ACCOUNTS_ENABLED
        value: "true"
      # Generated by Render as a base64 256-bit value, not prompted for. A
      # `sync: false` here is only ever asked for once, at blueprint creation,
      # so an empty one could not be filled in by re-syncing and the service
      # refused to boot. Rotating it signs every buyer out.
      - key: ACCOUNTS_SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: organics-kv
          type: keyvalue
          property: connectionString

      # ---- Google sign-in. The client ID is public. The secret must be set by
      # hand on this existing service because Render ignores new sync:false
      # values when a blueprint is re-synced.
      - key: GOOGLE_CLIENT_ID
        value: 166380570658-qlbuk355ftqqkljo92ggrsvbv4tj1hca.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ---- customer plans. Access remains free until this is deliberately
      # changed after Razorpay checkout and webhooks pass in test mode.
      - key: BILLING_ENABLED
        value: "false"
      - key: BILLING_TRIAL_DAYS
        value: "14"
      - key: BILLING_MONTHLY_PAISE
        value: "4900"
      - key: BILLING_ANNUAL_PAISE
        value: "49900"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PREVIOUS_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_MONTHLY_PLAN_ID
        sync: false
      - key: RAZORPAY_ANNUAL_PLAN_ID
        sync: false

      # ---- transactional mail: password and email verification, private
      # enquiry delivery, and operational notices. With SMTP_HOST unset,
      # externally delivered mail remains unavailable.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # ---- staff-only /tj tree. Leave ADMIN_PASSWORD_HASH unset and it 404s,
      # so the area is never live before you mean it to be.
      # Generate the hash with `npm run admin:hash`.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true

      # ---- the public origin. Set to the custom domain, not Render's own
      # hostname: password-reset links and every canonical/OG URL are built from
      # this, so deriving it from RENDER_EXTERNAL_URL would email people a
      # *.onrender.com link and tell Google the real site is the subdomain.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ossil.in

      # ---- plain settings
      - key: APP_ENV
        value: prod
      # Published on the privacy, trust, contact and careers pages as the address
      # for a data request or a complaint, and required when APP_ENV is prod.
      #
      # A literal value, not `sync: false`: Render only prompts for those at
      # blueprint *creation*, and ignores them on every later sync, so an empty
      # one could never be filled in by re-deploying — which is exactly how this
      # service came to boot-loop. Point it at a mailbox that exists.
      - key: CONTACT_EMAIL
        value: hello@ossil.in
      # Farmer numbers stay hidden until this is flipped to true.
      - key: SHOW_FARMER_PHONE
        value: "false"
      - key: NEXT_PUBLIC_CURRENCY
        value: INR
      - key: NEXT_PUBLIC_LOCALE
        value: en-IN
      # docker-entrypoint.sh runs `prisma migrate deploy` before starting.
      - key: RUN_MIGRATIONS
        value: "true"

  # Buyer sessions, the farmer portal's invite tokens and the rate limiter.
  # Same region as the web service so the two talk over the private network.
  - type: keyvalue
    name: organics-kv
    region: singapore
    plan: free
    # No public entry at all: only the web service needs it, and that reaches it
    # over Render's private network.
    ipAllowList: []
    # Sessions and rate-limit counters are both recoverable — a signed-out buyer
    # signs back in. `noeviction` would instead start refusing writes when the
    # 25 MB fills, which fails the login rate limiter closed and locks everyone
    # out of the site.
    maxmemoryPolicy: allkeys-lru
    # Not a choice: free instances have no persistence. A restart signs buyers
    # out, which is why nothing but sessions and counters is kept here.
    persistenceMode: 'off'

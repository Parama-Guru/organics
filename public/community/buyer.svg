<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stand-in portrait for the "who is on Organics" band on the home page.

  Flat vector in the site palette, in the same language as the product and farm
  artwork: it is not a photograph and does not pretend to be one. Replace it
  with a real, consented portrait of a buyer — the brief for that shot is in
  generate_images/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Illustration of a buyer carrying a cloth bag of produce">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf0e2"/>
      <stop offset="1" stop-color="#fadfc4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="800"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="800" fill="url(#wall)"/>

    <!-- A doorway and a step: a street, not a field, so the two portraits are
         not the same scene twice. -->
    <rect x="72" y="120" width="188" height="420" rx="18" fill="#f1ece3"/>
    <rect x="96" y="150" width="140" height="360" rx="12" fill="#d5e8db"/>
    <path d="M0 640 H640 V800 H0 Z" fill="#ded6ca"/>
    <path d="M0 640 H640 V672 H0 Z" fill="#c9bfb0"/>

    <!-- Figure -->
    <g>
      <!-- Kurta -->
      <path d="M320 372 c 74 0 128 40 140 104 l 26 208 c 2 18 -10 30 -28 30 H 182 c -18 0 -30 -12 -28 -30 l 26 -208 c 12 -64 66 -104 140 -104 Z" fill="#4a54a8"/>
      <path d="M320 372 c 22 0 42 4 60 10 l -60 82 -60 -82 c 18 -6 38 -10 60 -10 Z" fill="#eef0fb"/>
      <path d="M320 454 v 190" fill="none" stroke="#2f3782" stroke-width="6" stroke-linecap="round"/>

      <!-- Neck and head -->
      <path d="M290 320 h60 v70 c 0 16 -14 28 -30 28 s -30 -12 -30 -28 Z" fill="#c98a5e"/>
      <ellipse cx="320" cy="266" rx="84" ry="92" fill="#dda173"/>
      <!-- Hair pulled back, so the silhouette differs from the farmer's. -->
      <path d="M236 268 c 0 -70 38 -110 84 -110 s 84 40 84 110 c -8 -46 -34 -66 -84 -66 s -76 20 -84 66 Z" fill="#241a13"/>
      <path d="M398 250 c 34 10 46 44 34 74 -10 24 -34 30 -48 18 Z" fill="#241a13"/>
      <circle cx="292" cy="272" r="7" fill="#2a1c14"/>
      <circle cx="352" cy="272" r="7" fill="#2a1c14"/>
      <path d="M300 314 c 14 14 32 14 46 0" fill="none" stroke="#8a5a37" stroke-width="6" stroke-linecap="round"/>

      <!-- Cloth bag on the shoulder, produce showing at the top: the point of
           the whole site in one shape. -->
      <path d="M366 448 c 44 8 78 34 92 62" fill="none" stroke="#a9743f" stroke-width="10" stroke-linecap="round"/>
      <path d="M418 508 h 158 c 12 0 20 10 18 22 l -22 150 c -2 12 -12 20 -24 20 H 446 c -12 0 -22 -8 -24 -20 l -22 -150 c -2 -12 6 -22 18 -22 Z" fill="#b3d6bd"/>
      <path d="M420 508 c 8 -34 34 -54 78 -54 s 70 20 78 54" fill="none" stroke="#7fb790" stroke-width="10" stroke-linecap="round"/>
      <circle cx="462" cy="500" r="30" fill="#4b8f5e"/>
      <circle cx="520" cy="490" r="26" fill="#ec9346"/>
      <path d="M556 500 c 6 -30 22 -44 40 -44 -4 28 -18 44 -40 44 Z" fill="#326241"/>

      <!-- Free arm -->
      <path d="M186 470 c -28 30 -32 76 -14 116 l 18 40 46 -22 -16 -36 c -8 -20 -6 -42 6 -58 Z" fill="#dda173"/>
    </g>
  </g>
</svg>

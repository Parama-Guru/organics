<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stand-in portrait for the "who is on Organics" band on the home page.

  Flat vector in the site palette, in the same language as the product and farm
  artwork: it is not a photograph and does not pretend to be one. Replace it
  with a real, consented portrait of a listed farmer — the brief for that shot
  is in generate_images/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Illustration of a farmer holding a crate of vegetables">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3ec"/>
      <stop offset="1" stop-color="#d5e8db"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="800"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="800" fill="url(#sky)"/>

    <!-- Fields behind, kept low-contrast so the figure reads first. -->
    <path d="M0 560 C 140 512, 268 596, 400 552 C 500 518, 578 548, 640 528 L640 800 L0 800 Z" fill="#b3d6bd"/>
    <path d="M0 636 C 160 600, 300 664, 452 624 C 540 600, 596 620, 640 610 L640 800 L0 800 Z" fill="#7fb790"/>
    <circle cx="516" cy="150" r="60" fill="#ec9346" opacity="0.28"/>

    <!-- Figure -->
    <g>
      <!-- Torso: a work shirt, sleeves rolled. -->
      <path d="M320 372 c 74 0 128 40 140 104 l 26 208 c 2 18 -10 30 -28 30 H 182 c -18 0 -30 -12 -28 -30 l 26 -208 c 12 -64 66 -104 140 -104 Z" fill="#3d784e"/>
      <path d="M320 372 c 26 0 50 5 70 14 l -70 74 -70 -74 c 20 -9 44 -14 70 -14 Z" fill="#eaf3ec"/>
      <path d="M256 392 320 460 384 392" fill="none" stroke="#22422c" stroke-width="6" stroke-linejoin="round"/>

      <!-- Neck and head -->
      <path d="M290 320 h60 v70 c 0 16 -14 28 -30 28 s -30 -12 -30 -28 Z" fill="#c98a5e"/>
      <ellipse cx="320" cy="266" rx="84" ry="92" fill="#dda173"/>
      <path d="M236 262 c 0 -66 38 -104 84 -104 s 84 38 84 104 c 0 -30 -34 -44 -84 -44 s -84 14 -84 44 Z" fill="#3b2a20"/>
      <circle cx="290" cy="272" r="7" fill="#2a1c14"/>
      <circle cx="352" cy="272" r="7" fill="#2a1c14"/>
      <path d="M298 316 c 14 12 30 12 44 0" fill="none" stroke="#8a5a37" stroke-width="6" stroke-linecap="round"/>

      <!-- Sun hat, the one thing that says "outdoors" at thumbnail size. -->
      <path d="M150 214 c 0 -20 76 -34 170 -34 s 170 14 170 34 -76 32 -170 32 -170 -12 -170 -32 Z" fill="#ec9346"/>
      <path d="M232 208 c 0 -56 40 -92 88 -92 s 88 36 88 92 c -40 12 -136 12 -176 0 Z" fill="#cf6f1c"/>

      <!-- Crate of produce, held at the waist. -->
      <rect x="196" y="556" width="248" height="132" rx="14" fill="#a9743f"/>
      <rect x="196" y="592" width="248" height="16" fill="#8a5a2f"/>
      <rect x="196" y="640" width="248" height="16" fill="#8a5a2f"/>
      <circle cx="252" cy="546" r="40" fill="#c8443a"/>
      <circle cx="320" cy="534" r="46" fill="#4b8f5e"/>
      <circle cx="392" cy="548" r="38" fill="#ec9346"/>
      <path d="M320 488 c 14 -14 34 -16 44 -8 -10 16 -30 20 -44 8 Z" fill="#326241"/>

      <!-- Forearms, gripping the crate. -->
      <path d="M186 470 c -28 26 -34 68 -18 104 l 16 36 44 -20 -14 -32 c -8 -18 -6 -38 6 -52 Z" fill="#dda173"/>
      <path d="M454 470 c 28 26 34 68 18 104 l -16 36 -44 -20 14 -32 c 8 -18 6 -38 -6 -52 Z" fill="#dda173"/>
    </g>
  </g>
</svg>

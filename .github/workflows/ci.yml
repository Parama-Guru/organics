name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organics
          POSTGRES_PASSWORD: organics
          POSTGRES_DB: organics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organics -d organics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://organics:organics@localhost:5432/organics?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Fail if the schema has drifted from the migrations
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code

      - name: Seed the catalog
        run: npm run db:seed

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organics
          POSTGRES_PASSWORD: organics
          POSTGRES_DB: organics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organics -d organics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: organics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the real entrypoint with RUN_MIGRATIONS=true against a live database,
      # so a broken deploy path (missing DIRECT_URL, unreadable config, failed
      # migration) fails here instead of on Render. --network host is what lets the
      # container reach the service database on localhost.
      - name: Smoke test the image, including migrations
        run: |
          docker run -d --name organics --network host \
            -e RUN_MIGRATIONS=true \
            -e DATABASE_URL='postgresql://organics:organics@127.0.0.1:5432/organics?schema=public' \
            -e DIRECT_URL='postgresql://organics:organics@127.0.0.1:5432/organics?schema=public' \
            organics:ci
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Container is healthy and connected to the database"
              docker logs organics
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs organics
          exit 1

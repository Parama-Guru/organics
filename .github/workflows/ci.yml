name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: organics
          POSTGRES_PASSWORD: organics
          POSTGRES_DB: organics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organics -d organics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://organics:organics@localhost:5432/organics?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Fail if the schema has drifted from the migrations
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code

      - name: Seed the catalog
        run: npm run db:seed

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: organics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name organics -p 3000:3000 \
            -e RUN_MIGRATIONS=false \
            -e DATABASE_URL=postgresql://none:none@127.0.0.1:5432/none \
            organics:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            # 503 still proves the server booted and routed the request.
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Container is serving traffic (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to serve traffic"
          docker logs organics
          exit 1

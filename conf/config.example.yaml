# =============================================================================
# Organics — application configuration (single source of truth).
#
#   conf/config.example.yaml   tracked in git. No secrets: ${VAR} references only.
#   conf/config.yaml           gitignored. Real local values. Copy this file.
#
# Load order: $CONFIG_PATH -> conf/config.yaml -> conf/config.example.yaml
#
# "${VAR}" and "${VAR:-fallback}" are expanded from the process environment, so
# hosted deployments (Render, Vercel, docker compose) keep injecting plain env
# vars while this file stays the only place that describes the shape.
#
# NOT here on purpose: the listen host/port. Next.js takes those from HOSTNAME
# and PORT before any application code runs, so a value here would be a lie.
# =============================================================================

app:
  name: "Organics"
  env: "${APP_ENV:-dev}" # dev | prod
  site_url: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
  currency: "${NEXT_PUBLIC_CURRENCY:-INR}" # ISO 4217, inlined into the client bundle
  locale: "${NEXT_PUBLIC_LOCALE:-en-IN}" # digit grouping: en-IN = 12,34,567
  # Shown in the footer under "Trust" and on the privacy page. Leave empty and the
  # line is hidden — better nothing than a placeholder address on a trust page.
  contact_email: "${CONTACT_EMAIL:-}"
  contact_place: "${CONTACT_PLACE:-}"
  # Shown on the contact page. Each empty value hides its own line, so the page
  # never prints a number nobody answers.
  contact_phone: "${CONTACT_PHONE:-}"
  contact_address: "${CONTACT_ADDRESS:-}"
  contact_hours: "${CONTACT_HOURS:-}"
  # Publishing each farm's phone number is the point of the directory, but it
  # stays off until the farms have agreed. While false the call and WhatsApp
  # buttons are replaced by a "contact details coming soon" note.
  show_farmer_phone: ${SHOW_FARMER_PHONE:-false}
  # How many proxies of ours sit in front of the app. Rate limiting reads the
  # client address this many entries in from the right of X-Forwarded-For;
  # anything further left is client-supplied and forgeable. Render and Vercel
  # each put exactly one hop in front. Set 0 when the app is exposed directly,
  # and the header is ignored entirely.
  trusted_proxy_hops: ${TRUSTED_PROXY_HOPS:-1}

# Social accounts, linked from the footer. Each is rendered as a real link once
# its URL is set and as a dimmed, unclickable icon until then: an icon that
# quietly appears on the day the account opens is easy to miss, whereas a greyed
# out one is a visible reminder that the handle is still to be filled in.
social:
  instagram: "${SOCIAL_INSTAGRAM:-}"
  facebook: "${SOCIAL_FACEBOOK:-}"
  linkedin: "${SOCIAL_LINKEDIN:-}"
  youtube: "${SOCIAL_YOUTUBE:-}"
  # Full https://wa.me/91XXXXXXXXXX link, not a bare number.
  whatsapp: "${SOCIAL_WHATSAPP:-}"

database:
  # System of record, reached through Prisma. Everything the site reads lives
  # here: farms, catalog, categories.
  postgres:
    # Transaction-mode pooler (port 6543, `?pgbouncer=true`). Use this for the app:
    # serverless instances open far more connections than Postgres allows directly.
    url: "${DATABASE_URL}"
    # Session-mode pooler (port 5432). Prisma Migrate needs a real session because
    # a transaction-mode pooler cannot hold advisory locks or run DDL reliably.
    direct_url: "${DIRECT_URL:-}"

# Buyer accounts: a saved list of produce and farms to call later. Sessions live
# in Redis, so signing out takes effect immediately on every instance.
# Leave enabled false and the whole account area 404s.
accounts:
  enabled: ${ACCOUNTS_ENABLED:-false}
  # 32+ characters. Generate with: openssl rand -base64 48
  session_secret: "${ACCOUNTS_SESSION_SECRET:-}"
  session_ttl_days: 30

# Direct Google OpenID Connect. Both values stay server-side; the code uses an
# authorization-code flow with PKCE rather than accepting a browser-made login.
auth:
  google:
    client_id: "${GOOGLE_CLIENT_ID:-}"
    client_secret: "${GOOGLE_CLIENT_SECRET:-}"
    # Relative to conf/. Local only; conf/client_secret*.json is gitignored.
    client_secret_file: "${GOOGLE_CLIENT_SECRET_FILE:-}"

# Access is free while disabled. Enabling billing is a separate launch step only
# after checkout and the signed webhook have both been tested in Razorpay test mode.
billing:
  enabled: ${BILLING_ENABLED:-false}
  trial_days: ${BILLING_TRIAL_DAYS:-14}
  monthly_paise: ${BILLING_MONTHLY_PAISE:-4900} # ₹49
  annual_paise: ${BILLING_ANNUAL_PAISE:-49900} # ₹499
  razorpay_key_id: "${RAZORPAY_KEY_ID:-}"
  razorpay_key_secret: "${RAZORPAY_KEY_SECRET:-}"
  razorpay_webhook_secret: "${RAZORPAY_WEBHOOK_SECRET:-}"
  # Keep the old value here during Razorpay's retry window when rotating.
  razorpay_previous_webhook_secret: "${RAZORPAY_PREVIOUS_WEBHOOK_SECRET:-}"
  razorpay_monthly_plan_id: "${RAZORPAY_MONTHLY_PLAN_ID:-}"
  razorpay_annual_plan_id: "${RAZORPAY_ANNUAL_PLAN_ID:-}"

# Session store and the login rate limiter. Both have to be shared across
# instances, which process memory cannot do. Required once app.env is prod and
# accounts are enabled; in dev an in-process store stands in.
redis:
  url: "${REDIS_URL:-}"
  key_prefix: "${REDIS_KEY_PREFIX:-organics:}"

# Sends password-reset and verification links, enquiry relays, and operational
# notices. Leave host empty and externally delivered mail remains unavailable.
# In dev with no host, the link is written to the server log so the flow is
# still testable; that never happens when app.env is prod.
mail:
  host: "${SMTP_HOST:-}"
  port: ${SMTP_PORT:-587}
  user: "${SMTP_USER:-}"
  password: "${SMTP_PASSWORD:-}"
  from: "${SMTP_FROM:-}"

# Staff-only operations area at /tj. Not linked from the site and
# disallowed in robots.txt. Leave password_hash empty and the whole tree 404s,
# so a deployment is never accidentally left open.
admin:
  # scrypt hash, as `scrypt:<salt>:<key>`. Generate with `npm run admin:hash`.
  # Never store the passphrase itself, here or anywhere else.
  password_hash: "${ADMIN_PASSWORD_HASH:-}"
  # >=32 chars of randomness that signs the admin session cookie. Rotating it
  # signs everyone out immediately.
  session_secret: "${ADMIN_SESSION_SECRET:-}"
  session_ttl_minutes: 480
